<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>にゃんこ恋愛タロット｜何度でも無料で占える</title>

<meta property="og:title" content="にゃんこ恋愛タロット">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&family=Cormorant+Garamond:wght@500;600&display=swap">
<style>
  :root {
    --night: #2A2140;
    --night-2: #3A2D57;
    --rose: #E89AAE;
    --rose-deep: #C86B85;
    --gold: #E9C77B;
    --gold-soft: #F4E2B4;
    --cream: #FFF8F1;
    --ink: #4A3A48;
    --ink-soft: #7D6A78;
    --line: #EBDCE2;
    --font: "Zen Maru Gothic", -apple-system, "Hiragino Maru Gothic ProN", "Hiragino Sans", sans-serif;
    --font-en: "Cormorant Garamond", Georgia, serif;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; min-height: 100vh; color: var(--ink); font-family: var(--font); line-height: 1.8;
    background: radial-gradient(1200px 600px at 50% -10%, #4B3A6E 0%, var(--night) 55%, #1C1630 100%) no-repeat, var(--night);
    -webkit-font-smoothing: antialiased; font-feature-settings: "palt";
  }
  body::before { /* 星 */
    content: ""; position: fixed; inset: 0; pointer-events: none; opacity: .55;
    background-image:
      radial-gradient(1.2px 1.2px at 12% 18%, #fff, transparent),
      radial-gradient(1px 1px at 78% 12%, #fff, transparent),
      radial-gradient(1.4px 1.4px at 64% 34%, #fff, transparent),
      radial-gradient(1px 1px at 30% 62%, #fff, transparent),
      radial-gradient(1.2px 1.2px at 88% 70%, #fff, transparent),
      radial-gradient(1px 1px at 8% 86%, #fff, transparent),
      radial-gradient(1px 1px at 46% 8%, #fff, transparent),
      radial-gradient(1.3px 1.3px at 54% 90%, #fff, transparent);
  }
  .wrap { position: relative; max-width: 680px; margin: 0 auto; padding: 0 16px 72px; }

  header { text-align: center; padding: 36px 0 8px; color: var(--cream); }
  .eyebrow { font-family: var(--font-en); letter-spacing: .3em; font-size: 13px; color: var(--gold); }
  h1 { font-size: clamp(26px, 7vw, 36px); font-weight: 700; letter-spacing: .08em; margin: 6px 0 6px; line-height: 1.35; }
  h1 small { display: block; font-size: .5em; letter-spacing: .2em; color: var(--rose); font-weight: 500; }
  .lead { font-size: 14px; color: #D9CDE6; margin: 0; }

  .panel { background: var(--cream); border-radius: 20px; padding: 24px 20px; margin-top: 22px; box-shadow: 0 20px 50px rgba(0,0,0,.35); }
  .step { display: none; }
  .step.on { display: block; animation: fade .4s ease; }
  @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  .step-title { text-align: center; font-weight: 700; font-size: 18px; letter-spacing: .06em; margin: 0 0 4px; }
  .step-sub { text-align: center; font-size: 13px; color: var(--ink-soft); margin: 0 0 18px; }

  /* テーマ選択 */
  .themes { display: grid; gap: 10px; }
  .theme {
    appearance: none; font: inherit; color: inherit; text-align: left; cursor: pointer;
    display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-radius: 14px;
    border: 1.5px solid var(--line); background: #fff; transition: border-color .15s, transform .15s;
  }
  .theme:hover { border-color: var(--rose); transform: translateY(-1px); }
  .theme .ico { flex: none; width: 44px; height: 44px; border-radius: 50%; background: #FBE7ED; display: grid; place-items: center; }
  .theme b { display: block; font-size: 16px; }
  .theme span { font-size: 12.5px; color: var(--ink-soft); }

  .btn {
    appearance: none; border: 0; font: inherit; font-weight: 700; font-size: 16px; letter-spacing: .08em; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none;
    padding: 14px 28px; border-radius: 999px; color: #fff;
    background: linear-gradient(135deg, var(--rose) 0%, var(--rose-deep) 100%);
    box-shadow: 0 6px 16px rgba(200,107,133,.35);
  }
  .btn.ghost { background: #fff; color: var(--rose-deep); border: 1.5px solid var(--rose); box-shadow: none; }
  .btn.wide { width: 100%; }
  .center { text-align: center; }

  /* シャッフル */
  .shuffle-stage { position: relative; height: 210px; margin: 6px auto 18px; width: 140px; }
  .shuffle-stage .back { position: absolute; inset: 0; width: 120px; height: 200px; left: 10px; }
  .shuffle-stage.go .back:nth-child(1) { animation: sh1 .9s ease-in-out 2; }
  .shuffle-stage.go .back:nth-child(2) { animation: sh2 .9s ease-in-out 2; }
  .shuffle-stage.go .back:nth-child(3) { animation: sh3 .9s ease-in-out 2; }
  @keyframes sh1 { 50% { transform: translateX(-70px) rotate(-14deg); } }
  @keyframes sh2 { 50% { transform: translateX(70px) rotate(12deg); } }
  @keyframes sh3 { 50% { transform: translateY(-16px) rotate(3deg); } }

  /* カードを選ぶ */
  .spread { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; }
  @media (min-width: 560px) { .spread { grid-template-columns: repeat(8, 1fr); } }
  .pick {
    appearance: none; border: 0; padding: 0; background: none; cursor: pointer; aspect-ratio: 120 / 200;
    border-radius: 7px; transition: transform .18s; animation: deal .35s ease backwards;
  }
  .pick:hover { transform: translateY(-6px); }
  .pick:focus-visible { outline: 3px solid var(--rose); outline-offset: 2px; }
  .pick svg { width: 100%; height: 100%; display: block; filter: drop-shadow(0 3px 5px rgba(42,33,64,.25)); }
  @keyframes deal { from { opacity: 0; transform: translateY(14px) scale(.9); } }

  /* 結果 */
  .reveal { perspective: 1000px; width: min(220px, 60vw); margin: 4px auto 16px; aspect-ratio: 120 / 200; }
  .flipper { position: relative; width: 100%; height: 100%; transform-style: preserve-3d; transition: transform .9s cubic-bezier(.3,.7,.3,1); }
  .flipper.open { transform: rotateY(180deg); }
  .face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; }
  .face svg { width: 100%; height: 100%; display: block; filter: drop-shadow(0 10px 18px rgba(42,33,64,.35)); }
  .face.front { transform: rotateY(180deg); }
  .face.front.rev svg { transform: rotate(180deg); }

  .card-name { text-align: center; }
  .card-name .en { font-family: var(--font-en); letter-spacing: .2em; color: var(--rose-deep); font-size: 14px; }
  .card-name h2 { margin: 0; font-size: 24px; letter-spacing: .08em; }
  .pos { display: inline-block; margin-top: 6px; font-size: 12px; padding: 2px 12px; border-radius: 999px; background: #FBE7ED; color: var(--rose-deep); font-weight: 700; }
  .pos.rv { background: #E9E4F3; color: #6B5A92; }
  .kw { text-align: center; font-size: 13px; color: var(--ink-soft); margin: 8px 0 0; }

  .msg { margin-top: 20px; padding: 18px; border-radius: 14px; background: #fff; border: 1px solid var(--line); }
  .msg h3 { margin: 0 0 6px; font-size: 14px; color: var(--rose-deep); letter-spacing: .06em; display: flex; align-items: center; gap: 6px; }
  .msg p { margin: 0; font-size: 15px; }
  .msg.advice { background: #FFF3E0; border-color: #F3DDB8; }
  .msg.advice h3 { color: #A9782A; }

  .lucky { margin-top: 12px; padding: 16px 18px; border-radius: 14px; background: linear-gradient(135deg, #FDEFF3, #F3EDFB); display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .lucky .lbl { font-size: 12px; color: var(--ink-soft); }
  .lucky .item { font-weight: 700; font-size: 16px; }
  .lucky .txt { flex: 1; min-width: 160px; }
  .lucky a { font-size: 13px; padding: 9px 16px; }
  .pr { font-size: 10px; font-weight: 700; padding: 1px 6px; border-radius: 4px; background: #fff; color: var(--ink-soft); border: 1px solid var(--line); margin-left: 6px; vertical-align: 2px; }

  .actions { display: grid; gap: 10px; margin-top: 22px; }
  .share { display: flex; gap: 10px; }
  .share .btn { flex: 1; font-size: 14px; padding: 12px 10px; }

  .note { text-align: center; font-size: 11.5px; color: #B9AEC8; margin-top: 22px; line-height: 1.7; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">LOVE TAROT</div>
    <h1><small>猫たちがささやく</small>にゃんこ恋愛タロット</h1>
    <p class="lead">無料・登録なし・何度でも占えます</p>
  </header>

  <main class="panel">
    <!-- 1. テーマ -->
    <section class="step on" id="s-theme">
      <p class="step-title">何を占いますか？</p>
      <p class="step-sub">いちばん知りたいことをひとつ選んでね</p>
      <div class="themes" id="themes"></div>
    </section>

    <section class="step" id="s-shuffle">
      <p class="step-title" id="shuffle-title">あの人を思い浮かべて…</p>
      <p class="step-sub">心の中で質問を唱えながら、ボタンを押してね</p>
      <div class="shuffle-stage" id="stage"></div>
      <div class="center"><button class="btn" id="do-shuffle">カードをシャッフル</button></div>
    </section>

    <!-- 3. 選ぶ -->
    <section class="step" id="s-pick">
      <p class="step-title">気になる1枚を選んでね</p>
      <p class="step-sub">直感で、ピンときたカードを</p>
      <div class="spread" id="spread"></div>
    </section>

    <!-- 4. 結果 -->
    <section class="step" id="s-result">
      <div class="reveal"><div class="flipper" id="flipper">
        <div class="face back-face" id="r-back"></div>
        <div class="face front" id="r-front"></div>
      </div></div>
      <div id="r-body" style="opacity:0; transition: opacity .5s .6s;">
        <div class="card-name">

          <h2 id="r-name"></h2>
          <span class="pos" id="r-pos"></span>
        </div>
        <p class="kw" id="r-kw"></p>

        <div class="msg">
          <h3 id="r-theme-ttl"></h3>
          <p id="r-msg"></p>
        </div>
        <div class="msg advice">
          <h3>にゃんこからのアドバイス</h3>
          <p id="r-adv"></p>
        </div>
        <div class="lucky" id="r-lucky"></div>

        <div class="actions">
          <button class="btn wide" id="again-same">同じテーマでもう一度</button>
          <button class="btn ghost wide" id="again-top">ほかのテーマを占う</button>
          <div class="share">
            <a class="btn ghost" id="share-x" target="_blank" rel="noopener">Xでシェア</a>
            <a class="btn ghost" id="share-th" target="_blank" rel="noopener">Threadsでシェア</a>
          </div>
        </div>
      </div>
    </section>
  </main>

  <p class="note">占いの結果は、あなたの背中をそっと押すためのものです。<br>最後に決めるのは、いつもあなた自身。</p>
</div>

  scales: '<g fill="none" stroke="#FFF8F1" stroke-width="5" stroke-linecap="round"><path d="M100 58v52M70 70h60M88 110h24"/><path d="M62 90l8-20l8 20z M122 90l8-20l8 20z" fill="#FFF8F1"/></g>',
  drop: '<path d="M100 56c12 20 22 32 22 44a22 22 0 0 1-44 0c0-12 10-24 22-44z" fill="#FFF8F1"/>',
  sprout: '<g fill="#FFF8F1"><path d="M100 112V84" stroke="#FFF8F1" stroke-width="5"/><path d="M100 86c-4-18-20-26-32-22c2 14 16 24 32 22z"/><path d="M100 80c4-16 18-24 30-20c-2 12-14 22-30 20z"/></g>',
  cup: '<g fill="#FFF8F1"><path d="M76 62h48c0 22-10 34-24 34s-24-12-24-34z"/><rect x="96" y="94" width="8" height="12"/><rect x="84" y="104" width="32" height="6" rx="3"/></g>',

  bolt: '<path d="M108 54l-26 36h16l-8 26l28-38h-16z" fill="#FFF8F1"/>',
  star: '<path d="M100 54l9 20l22 3l-16 15l4 22l-19-11l-19 11l4-22l-16-15l22-3z" fill="#FFF8F1"/>',
  moon: '<circle cx="100" cy="84" r="28" fill="#FFF8F1"/><circle cx="91" cy="78" r="5" fill="#000" opacity=".08"/><circle cx="110" cy="92" r="7" fill="#000" opacity=".08"/>',
  sun: '<g fill="#FFF8F1"><circle cx="100" cy="84" r="18"/><g stroke="#FFF8F1" stroke-width="5" stroke-linecap="round"><path d="M100 52v10M100 106v10M68 84h10M122 84h10M77 61l7 7M116 100l7 7M123 61l-7 7M84 100l-7 7"/></g></g>',
  bell: '<g fill="#FFF8F1"><path d="M78 104c4-8 4-20 6-30a16 16 0 0 1 32 0c2 10 2 22 6 30z"/><circle cx="100" cy="110" r="6"/><circle cx="100" cy="56" r="4"/></g>',
  wreath: '<g fill="#FFF8F1"><circle cx="100" cy="84" r="28" fill="none" stroke="#FFF8F1" stroke-width="4"/>' +
    Array.from({ length: 12 }, (_, i) => { const a = i * Math.PI / 6; return `<ellipse cx="${(100 + 28 * Math.cos(a)).toFixed(1)}" cy="${(84 + 28 * Math.sin(a)).toFixed(1)}" rx="5" ry="3" transform="rotate(${i * 30 + 90} ${(100 + 28 * Math.cos(a)).toFixed(1)} ${(84 + 28 * Math.sin(a)).toFixed(1)})"/>`; }).join('') + '</g>',
};

/* 座っている猫（後ろ向き・空を見上げる） */
function catSVG(fill) {
  return `<g fill="${fill}">
    <path d="M128 296c30 0 42-20 34-34" fill="none" stroke="${fill}" stroke-width="10" stroke-linecap="round"/>
    <path d="M100 168c-30 0-48 40-48 86c0 30 20 46 48 46s48-16 48-46c0-46-18-86-48-86z"/>
    <circle cx="100" cy="160" r="30"/>
    <path d="M73 150l-4-34l26 20z"/><path d="M127 150l4-34l-26 20z"/>
  </g>
  <path d="M75 146l-2-22l14 12z M125 146l2-22l-14 12z" fill="#F7B6C5" opacity=".7"/>`;
}

function frontSVG(card) {
  const id = 'g' + card.no.replace(/\W/g, '') + card.sym;
  return `<svg viewBox="0 0 200 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="${card.name}のカード">
    <defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${card.c[0]}"/><stop offset="1" stop-color="${card.c[1]}"/></linearGradient></defs>
    <rect x="2" y="2" width="196" height="336" rx="14" fill="#FFF8F1"/>
    <rect x="10" y="10" width="180" height="320" rx="10" fill="url(#${id})"/>
    <rect x="16" y="16" width="168" height="308" rx="8" fill="none" stroke="#FFF8F1" stroke-width="1.5" opacity=".8"/>
    <text x="100" y="40" text-anchor="middle" font-family="Cormorant Garamond, Georgia, serif" font-size="18" font-weight="600" fill="#FFF8F1" letter-spacing="2">${card.no}</text>
    ${SYMBOLS[card.sym]}
    ${catSVG('#3A2D57')}
    <rect x="10" y="298" width="180" height="32" fill="#FFF8F1" opacity=".92"/>
    <text x="100" y="319" text-anchor="middle" font-family="Zen Maru Gothic, sans-serif" font-size="15" font-weight="700" fill="#4A3A48" letter-spacing="3">${card.name}</text>
  </svg>`;
}

const BACK_SVG = `<svg viewBox="0 0 120 200" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <rect x="1" y="1" width="118" height="198" rx="9" fill="#FFF8F1"/>
  <rect x="6" y="6" width="108" height="188" rx="6" fill="#3A2D57"/>
  <rect x="11" y="11" width="98" height="178" rx="4" fill="none" stroke="#E9C77B" stroke-width="1.2"/>
  <g fill="#E9C77B">
    <path d="M60 78c-12 0-20 9-20 20c0 12 9 18 20 18s20-6 20-18c0-11-8-20-20-20z"/>
    <path d="M43 90l-2-20l13 10z M77 90l2-20l-13 10z"/>
    <path d="M60 128l3 7l7 1l-5 5l1 7l-6-3l-6 3l1-7l-5-5l7-1z"/>
    <circle cx="28" cy="30" r="1.6"/><circle cx="92" cy="40" r="1.2"/><circle cx="24" cy="160" r="1.2"/><circle cx="94" cy="170" r="1.6"/><circle cx="60" cy="28" r="1"/><circle cx="60" cy="176" r="1"/>
  </g>
  <g fill="#3A2D57"><ellipse cx="52" cy="98" rx="2.4" ry="3.4"/><ellipse cx="68" cy="98" rx="2.4" ry="3.4"/></g>
</svg>`;

const THEME_ICON = {
  heart: '<svg width="24" height="24" viewBox="0 0 24 24"><path d="M12 21c-6-4-9-7.5-9-11a5 5 0 0 1 9-3a5 5 0 0 1 9 3c0 3.5-3 7-9 11z" fill="#E89AAE"/></svg>',
  star: '<svg width="24" height="24" viewBox="0 0 24 24"><path d="M12 2l3 6.5l7 .8l-5.2 4.8l1.5 7L12 17.5L5.7 21l1.5-7L2 9.3l7-.8z" fill="#E9C77B"/></svg>',
  moon: '<svg width="24" height="24" viewBox="0 0 24 24"><path d="M15 3a9 9 0 1 0 6 15a7 7 0 1 1-6-15z" fill="#9C8CCB"/></svg>',
};

/* ---------- 画面の動き ---------- */
const $ = (id) => document.getElementById(id);
let theme = THEMES[0];

function show(step) {
  document.querySelectorAll('.step').forEach((s) => s.classList.toggle('on', s.id === step));
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

$('themes').innerHTML = THEMES.map((t, i) =>
  `<button class="theme" data-i="${i}"><span class="ico">${THEME_ICON[t.ico]}</span><span><b>${t.title}</b><span>${t.sub}</span></span></button>`).join('');
$('themes').addEventListener('click', (e) => {
  const b = e.target.closest('.theme'); if (!b) return;
  theme = THEMES[+b.dataset.i];
  toShuffle();
});

function toShuffle() {
  $('shuffle-title').textContent = theme.shuffle;
  $('stage').className = 'shuffle-stage';
  $('stage').innerHTML = [0, 1, 2].map(() => `<div class="back">${BACK_SVG}</div>`).join('');
  $('do-shuffle').disabled = false;
  show('s-shuffle');
}

$('do-shuffle').addEventListener('click', () => {
  $('do-shuffle').disabled = true;
  $('stage').classList.add('go');
  setTimeout(dealCards, 1800);
});

function rand(n) { // 偏りの少ない乱数
  if (window.crypto && crypto.getRandomValues) {
    const a = new Uint32Array(1); crypto.getRandomValues(a); return a[0] % n;
  }
  return Math.floor(Math.random() * n);
}

let deck = [];
function dealCards() {
  deck = CARDS.map((c, i) => i);
  for (let i = deck.length - 1; i > 0; i--) { const j = rand(i + 1); [deck[i], deck[j]] = [deck[j], deck[i]]; }
  $('spread').innerHTML = deck.map((_, k) =>
    `<button class="pick" data-k="${k}" style="animation-delay:${k * 25}ms" aria-label="${k + 1}枚目のカード">${BACK_SVG}</button>`).join('');
  show('s-pick');
}

$('spread').addEventListener('click', (e) => {
  const b = e.target.closest('.pick'); if (!b) return;
  const card = CARDS[deck[+b.dataset.k]];
  const reversed = rand(3) === 0; // 逆位置は 1/3 の確率
  reveal(card, reversed);
});

function reveal(card, reversed) {
  const r = reversed ? card.rv : card.up;
  $('r-back').innerHTML = BACK_SVG;
  $('r-front').innerHTML = frontSVG(card);
  $('r-front').classList.toggle('rev', reversed);
  $('flipper').classList.remove('open');
  $('r-body').style.opacity = 0;

  $('r-en').textContent = card.en;
  $('r-name').textContent = card.name;
  $('r-pos').textContent = reversed ? '逆位置' : '正位置';
  $('r-pos').classList.toggle('rv', reversed);
  $('r-kw').textContent = r.kw;
  $('r-theme-ttl').textContent = theme.ttl;
  $('r-msg').textContent = r[theme.key];
  $('r-adv').textContent = r.adv;

  const lucky = LUCKY[rand(LUCKY.length)];
  $('r-lucky').innerHTML =
    `<div class="txt"><div class="lbl">今日のラッキーアイテム${lucky.url ? '<span class="pr">PR</span>' : ''}</div><div class="item"></div></div>` +
    (lucky.url ? `<a class="btn" href="${encodeURI(lucky.url)}" target="_blank" rel="sponsored noopener">見てみる</a>` : '');
  $('r-lucky').querySelector('.item').textContent = lucky.item;

  const text = `にゃんこ恋愛タロットで「${theme.title}」を占ったら【${card.name}（${reversed ? '逆位置' : '正位置'}）】が出たよ🐈‍⬛\n${r.kw}`;
  $('share-x').href = 'https://twitter.com/intent/tweet?text=' + encodeURIComponent(text) + '&url=' + encodeURIComponent(SHARE_URL);
  $('share-th').href = 'https://www.threads.net/intent/post?text=' + encodeURIComponent(text + '\n' + SHARE_URL);

  show('s-result');
  setTimeout(() => { $('flipper').classList.add('open'); $('r-body').style.opacity = 1; }, 350);
}

$('again-same').addEventListener('click', toShuffle);
$('again-top').addEventListener('click', () => show('s-theme'));
</script>
